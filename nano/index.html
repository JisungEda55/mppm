<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>전역일 계산기 위젯 이미지 생성기</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
            background-color: #f0f2f5;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 40px;
            margin: 0;
        }

        /* 캡처할 타겟 컨테이너 (배경 투명) */
        #widget-container {
            width: 500px;
            padding: 20px;
            background: transparent;
            display: flex;
            flex-direction: column;
            gap: 15px;
        }

        /* 상단 영역 (프로필/정보박스 배치) */
        .top-section {
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
            background: transparent;
        }

        /* 왼쪽 원형 영역 */
        .profile-circle {
            width: 130px;
            height: 130px;
            border-radius: 50%;
            background: transparent;
        }

        /* 오른쪽 정보 카드 */
        .info-card {
            border: 2.5px solid #000000;
            border-radius: 24px;
            padding: 16px 20px;
            background-color: #ffffff;
            width: 200px;
            box-sizing: border-box;
        }

        .info-card .name {
            font-size: 24px;
            font-weight: bold;
            margin-bottom: 12px;
            color: #000000;
        }

        .info-card .date-row {
            display: flex;
            justify-content: space-between;
            font-size: 14px;
            color: #555555;
            margin-bottom: 4px;
        }

        .info-card .date-row .label {
            color: #888888;
        }

        .info-card .date-row .date {
            font-weight: 500;
            letter-spacing: 0.5px;
        }

        .info-card .time-left {
            font-size: 13px;
            font-weight: bold;
            color: #333333;
            text-align: center;
            margin-top: 10px;
        }

        /* 중단 D-Day 바 */
        .dday-bar {
            background-color: #2b56c6;
            color: #ffffff;
            padding: 12px 20px;
            border-radius: 8px 8px 0 0;
            font-size: 16px;
            font-weight: bold;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        /* 하단 프로그레스 바 영역 */
        .progress-section {
            background-color: #5393ff;
            color: #ffffff;
            padding: 20px;
            border-radius: 0 0 8px 8px;
            margin-top: -15px;
        }

        .progress-header {
            display: flex;
            justify-content: space-between;
            font-size: 15px;
            font-weight: bold;
            margin-bottom: 12px;
        }

        /* 게이지 바 스타일 */
        .progress-bar-container {
            width: 100%;
            height: 12px;
            background-color: rgba(255, 255, 255, 0.3);
            border-radius: 6px;
            overflow: hidden;
            position: relative;
            margin-bottom: 8px;
        }

        .progress-bar-fill {
            width: 82.975455%;
            height: 100%;
            background-color: #0d369c;
            border-radius: 6px 0 0 6px;
        }

        .progress-percentage {
            text-align: right;
            font-size: 14px;
            font-weight: 500;
            color: rgba(255, 255, 255, 0.9);
        }

        /* 생성 버튼 스타일 */
        .download-btn {
            margin-top: 30px;
            padding: 12px 24px;
            background-color: #2b56c6;
            color: white;
            border: none;
            border-radius: 8px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            transition: background 0.2s;
        }

        .download-btn:hover {
            background-color: #1e3f96;
        }

        /* iOS 대응 프리뷰 오버레이 팝업 */
        #image-overlay {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-color: rgba(0, 0, 0, 0.85);
            z-index: 1000;
            justify-content: center;
            align-items: center;
            flex-direction: column;
            color: #ffffff;
        }

        #image-overlay .guide-text {
            font-size: 16px;
            margin-bottom: 20px;
            text-align: center;
            line-height: 1.5;
            background: rgba(255, 255, 255, 0.2);
            padding: 10px 20px;
            border-radius: 20px;
        }

        #image-overlay img {
            max-width: 90%;
            max-height: 70%;
            box-shadow: 0 4px 15px rgba(0,0,0,0.5);
            background: transparent; /* 투명 유지 확인용 */
        }

        #image-overlay .close-btn {
            margin-top: 25px;
            padding: 10px 20px;
            background-color: rgba(255, 255, 255, 0.3);
            border: 1px solid #ffffff;
            color: #ffffff;
            border-radius: 6px;
            cursor: pointer;
            font-size: 14px;
        }
    </style>
</head>
<body>

    <div id="widget-container">
        <div class="top-section">
            <div class="profile-circle"></div>
            <div class="info-card">
                <div class="name">병장 신지성</div>
                <div class="date-row">
                    <span class="label">입대</span>
                    <span class="date">2025.02.10</span>
                </div>
                <div class="date-row">
                    <span class="label">전역</span>
                    <span class="date">2026.10.09</span>
                </div>
                <div class="time-left">3개월 12일 남았습니다</div>
            </div>
        </div>

        <div class="dday-bar">
            <svg width="16" height="16" viewBox="0 0 24 24" fill="currentColor">
                <path d="M10 20v-6h4v6h5v-8h3L12 3 2 12h3v8z"/>
            </svg>
            <span>D-104</span>
        </div>

        <div class="progress-section">
            <div class="progress-header">
                <span>전역 ❯</span>
                <span>2026년 10월 09일</span>
            </div>
            <div class="progress-bar-container">
                <div class="progress-bar-fill"></div>
            </div>
            <div class="progress-percentage">82.975455%</div>
        </div>
    </div>

    <button class="download-btn" onclick="generateImageForIOS()">이미지 생성하기</button>

    <div id="image-overlay" onclick="closeOverlay(event)">
        <div class="guide-text">아래 이미지를 <b>길게 누른 뒤</b><br>['사진' 앱에 저장]을 선택해주세요.</div>
        <img id="preview-image" src="" alt="위젯 이미지">
        <button class="close-btn" onclick="document.getElementById('image-overlay').style.display='none';">닫기</button>
    </div>

    <script>
        function generateImageForIOS() {
            const container = document.getElementById('widget-container');
            const overlay = document.getElementById('image-overlay');
            const previewImg = document.getElementById('preview-image');
            
            // html2canvas 옵션 (배경 투명화 및 고화질)
            html2canvas(container, {
                backgroundColor: null, 
                scale: 3,             // 롱프레스 저장 시 화질 저하 방지를 위해 배율을 3으로 상향
                logging: false,
                useCORS: true
            }).then(canvas => {
                // Base64 PNG 이미지 데이터 추출
                const imageData = canvas.toDataURL('image/png');
                
                // img 태그에 소스 주입 및 팝업 표시
                previewImg.src = imageData;
                overlay.style.display = 'flex';
            }).catch(error => {
                console.error('이미지 생성 오류:', error);
                alert('이미지 생성에 실패했습니다.');
            });
        }

        // 이미지 외의 블랙 영역 터치 시 닫히도록 설정
        function closeOverlay(event) {
            if(event.target.id === 'image-overlay') {
                document.getElementById('image-overlay').style.display = 'none';
            }
        }
    </script>

</body>
</html>
