<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>nano D-Day Widget</title>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>

    <style>
        @font-face {
            font-family: 'LineSeed';
            src: url('https://cdn.jsdelivr.net/gh/projectnoonnu/noonfonts_11-01@1.0/LINESeedKR-Bd.woff2') format('woff2');
            font-weight: 700;
            font-display: swap;
        }

        * {
            box-sizing: border-box;
            font-family: 'LineSeed', -apple-system, sans-serif;
            font-weight: 700;
            -webkit-font-smoothing: antialiased;
        }

        body {
            background-color: #f4f6fa;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 20px;
            margin: 0;
            min-height: 100vh;
        }

        .tab-menu {
            display: flex;
            background: #e2e8f0;
            padding: 4px;
            border-radius: 12px;
            margin-bottom: 25px;
            width: 100%;
            max-width: 360px;
            position: relative;
            z-index: 10;
        }

        .tab-btn {
            flex: 1;
            border: none;
            background: transparent;
            padding: 10px;
            font-size: 14px;
            cursor: pointer;
            border-radius: 9px;
            transition: all 0.2s;
            color: #64748b;
        }

        .tab-btn.active {
            background: #ffffff;
            color: #0f172a;
            box-shadow: 0 2px 6px rgba(0,0,0,0.08);
        }

        .widget-wrapper {
            width: 100%;
            max-width: 360px;
            position: relative;
        }

        .capture-area {
            width: 100%;
            padding: 10px;
            background: transparent;
        }

        /* ==================== [스타일 1: 오리지널 순정] ==================== */

        #widget-classic {
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        #widget-classic .top-section {
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
        }

        #widget-classic .profile-circle {
            width: 100px;
            height: 100px;
            border-radius: 50%;
            background: #e2e8f0;
        }

        #widget-classic .info-card {
            border: 2px solid #000;
            border-radius: 20px;
            padding: 12px 16px;
            background-color: #fff;
            width: calc(100% - 115px);
        }

        #widget-classic .name {
            font-size: 18px;
            margin-bottom: 8px;
            color: #000;
        }

        #widget-classic .date-row {
            display: flex;
            justify-content: space-between;
            font-size: 12px;
            margin-bottom: 3px;
        }

        #widget-classic .date-row .label {
            color: #888888;
        }

        #widget-classic .time-left {
            font-size: 12px;
            text-align: center;
            margin-top: 8px;
            color: #333333;
        }

        #widget-classic .dday-bar {
            background-color: #2b56c6;
            color: #ffffff;
            padding: 10px 14px;
            border-radius: 8px 8px 0 0;
            font-size: 14px;
            display: flex;
            align-items: center;
            gap: 6px;
        }

        #widget-classic .progress-section {
            background-color: #5393ff;
            color: #ffffff;
            padding: 16px;
            border-radius: 0 0 8px 8px;
            margin-top: -12px;
        }

        #widget-classic .progress-header {
            display: flex;
            justify-content: space-between;
            font-size: 13px;
            margin-bottom: 10px;
        }

        #widget-classic .progress-bar-container {
            width: 100%;
            height: 10px;
            background-color: rgba(255, 255, 255, 0.3);
            border-radius: 5px;
            overflow: hidden;
            margin-bottom: 6px;
        }

        #widget-classic .progress-bar-fill {
            height: 100%;
            background-color: #0d369c;
        }

        #widget-classic .progress-stats {
            display: flex;
            justify-content: space-between;
            align-items: baseline;
            margin-top: 4px;
        }

        #widget-classic .served-days {
            font-size: 10px;
            color: rgba(255, 255, 255, 0.75);
            letter-spacing: 0.5px;
        }

        #widget-classic .progress-percentage {
            text-align: right;
            font-size: 12px;
            color: rgba(255, 255, 255, 0.9);
        }

        /* ==================== [스타일 2: 트렌디 힙 스타일] ==================== */

        #widget-trendy {
            position: relative;
            min-height: 280px;
            display: none;
            background: #f4f6fa;
            background-image: radial-gradient(#cbd5e1 1px, transparent 1px);
            background-size: 16px 16px;
            border-radius: 24px;
            overflow: hidden;
        }

        #widget-trendy.is-capturing {
            background: none !important;
            background-color: transparent !important;
        }

        .trendy-layout {
            position: relative;
            width: 100%;
            height: 100%;
            padding: 20px 10px;
        }

        .neo-card {
            background: #ffffff;
            border: 2.5px solid #111827;
            border-radius: 16px;
            box-shadow: 4px 4px 0px #111827;
            padding: 16px;
            position: relative;
        }

        .trendy-info-card {
            width: 85%;
            transform: rotate(-3deg);
            z-index: 2;
            margin-left: 5%;
        }

        .trendy-info-card .card-header {
            display: flex;
            align-items: center;
            gap: 12px;
            margin-bottom: 12px;
            border-bottom: 2px dashed #e2e8f0;
            padding-bottom: 12px;
        }

        .trendy-info-card .profile-mock {
            width: 48px;
            height: 48px;
            background: linear-gradient(135deg, #a7f3d0, #3b82f6);
            border-radius: 12px;
            border: 2px solid #111827;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .fluent-emoji {
            width: 32px;
            height: 32px;
            object-fit: contain;
        }

        .trendy-info-card .name {
            font-size: 20px;
            color: #111827;
            margin: 0 0 4px 0;
            letter-spacing: -0.5px;
        }

        .trendy-info-card .badge {
            background: #111827;
            color: #fff;
            font-size: 10px;
            padding: 2px 6px;
            border-radius: 4px;
        }

        .trendy-info-card .dates {
            display: flex;
            justify-content: space-between;
            font-size: 12px;
            color: #4b5563;
        }

        .trendy-info-card .dates span {
            display: inline-block;
            background: #f1f5f9;
            border: 1px solid #cbd5e1;
            padding: 2px 6px;
            border-radius: 4px;
            margin-right: 6px;
            font-size: 10px;
            color: #64748b;
        }

        .trendy-progress-card {
            width: 90%;
            transform: rotate(2deg);
            z-index: 3;
            margin-left: auto;
            margin-top: -15px;
            background: #eef2ff;
        }

        .trendy-progress-card .progress-text-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 10px;
        }

        .trendy-time-left {
            font-size: 13px;
            color: #111827;
            background: #fff;
            border: 1.5px solid #111827;
            padding: 4px 10px;
            border-radius: 20px;
        }

        .trendy-right-stats {
            display: flex;
            flex-direction: column;
            align-items: flex-end;
            line-height: 1.3;
        }

        .trendy-served-days {
            font-size: 9px;
            color: #64748b;
            font-weight: 600;
        }

        .trendy-percentage {
            font-size: 16px;
            color: #4f46e5;
            text-shadow: none !important;
        }

        .trendy-bar-bg {
            width: 100%;
            height: 16px;
            background: #fff;
            border: 2px solid #111827;
            border-radius: 30px;
            overflow: hidden;
        }

        .trendy-bar-fill {
            height: 100%;
            background: #3b82f6;
            background-image: repeating-linear-gradient(
                45deg,
                transparent,
                transparent 10px,
                rgba(255,255,255,0.2) 10px,
                rgba(255,255,255,0.2) 20px
            );
            border-right: 2px solid #111827;
        }

        .sticker-dday {
            position: absolute;
            top: 10px;
            right: 15px;
            background: #a3e635;
            color: #111827;
            border: 2px solid #111827;
            padding: 8px 16px;
            border-radius: 30px;
            font-size: 16px;
            transform: rotate(10deg);
            z-index: 4;
            box-shadow: 2px 2px 0px #111827;
        }

        .sticker-star {
            position: absolute;
            bottom: 15px;
            left: 10px;
            width: 36px;
            height: 36px;
            transform: rotate(-15deg);
            z-index: 4;
            filter: drop-shadow(2px 2px 0px rgba(0,0,0,0.8));
        }

        .sticker-flower {
            position: absolute;
            top: 40%;
            left: -5px;
            width: 32px;
            height: 32px;
            z-index: 1;
            filter: drop-shadow(2px 2px 0px rgba(0,0,0,0.6));
        }

        .action-container {
            width: 100%;
            max-width: 360px;
            display: flex;
            flex-direction: column;
            gap: 12px;
            margin-top: 15px;
        }

        .download-btn {
            width: 100%;
            padding: 16px;
            background-color: #111827;
            color: white;
            border: none;
            border-radius: 12px;
            font-size: 16px;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
        }

        .download-btn img {
            width: 22px;
            height: 22px;
        }

        #image-overlay {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-color: rgba(0, 0, 0, 0.9);
            z-index: 2000;
            justify-content: center;
            align-items: center;
            flex-direction: column;
            padding: 20px;
        }

        #image-overlay .guide-text {
            font-size: 14px;
            margin-bottom: 16px;
            text-align: center;
            color: #fff;
        }

        #image-overlay img {
            max-width: 100%;
            max-height: 65%;
            box-shadow: 0 4px 20px rgba(0,0,0,0.5);
        }

        #image-overlay .close-btn {
            margin-top: 20px;
            padding: 12px 28px;
            background: #fff;
            border-radius: 30px;
            border: none;
        }
    </style>
</head>

<body>

    <div class="tab-menu">
        <button class="tab-btn active" onclick="switchStyle('classic', this)">
            기존 (오리지널)
        </button>

        <button class="tab-btn" onclick="switchStyle('trendy', this)">
            신규 (힙 트렌디)
        </button>
    </div>

    <div class="widget-wrapper">

        <!-- ==================== 클래식 위젯 ==================== -->

        <div id="widget-classic" class="capture-area">

            <div class="top-section">

                <div class="profile-circle"></div>

                <div class="info-card">

                    <div class="name">
                        병장 신지성
                    </div>

                    <div class="date-row">
                        <span class="label">입대</span>
                        <span>2025.02.10</span>
                    </div>

                    <div class="date-row">
                        <span class="label">전역</span>
                        <span>2026.10.09</span>
                    </div>

                    <div id="classic-time-left" class="time-left">
                        계산 중...
                    </div>

                </div>

            </div>

            <div>

                <div class="dday-bar">
                    D-Day 카운트
                </div>

                <div class="progress-section">

                    <div class="progress-header">
                        <span id="classic-dday">
                            D-000
                        </span>
                    </div>

                    <div class="progress-bar-container">
                        <div
                            id="classic-bar-fill"
                            class="progress-bar-fill">
                        </div>
                    </div>

                    <div class="progress-stats">

                        <span
                            id="classic-served-days"
                            class="served-days">
                            0 / 606
                        </span>

                        <span
                            id="classic-percent"
                            class="progress-percentage">
                            0.000000%
                        </span>

                    </div>

                </div>

            </div>

        </div>


        <!-- ==================== 트렌디 위젯 ==================== -->

        <div id="widget-trendy" class="capture-area">

            <div class="trendy-layout">

                <div
                    class="sticker-dday"
                    id="trendy-dday">
                    D-000
                </div>

                <img
                    src="https://cdn.jsdelivr.net/gh/microsoft/fluentui-emoji@latest/assets/Sparkles/3D/sparkles_3d.png"
                    width="36"
                    height="36"
                    alt="✨"
                    class="sticker-star"
                    crossorigin="anonymous"
                >

                <img
                    src="https://cdn.jsdelivr.net/gh/microsoft/fluentui-emoji@latest/assets/Party%20popper/3D/party_popper_3d.png"
                    width="32"
                    height="32"
                    alt="🎉"
                    class="sticker-flower"
                    crossorigin="anonymous"
                >

                <div class="neo-card trendy-info-card">

                    <div class="card-header">

                        <div class="profile-mock">

                            <img
                                src="https://cdn.jsdelivr.net/gh/microsoft/fluentui-emoji@latest/assets/Star-struck/3D/star-struck_3d.png"
                                width="32"
                                height="32"
                                class="fluent-emoji"
                                crossorigin="anonymous"
                            >

                        </div>

                        <div>

                            <div class="name">
                                병장 신지성
                            </div>

                            <span class="badge">
                                NAVY
                            </span>

                        </div>

                    </div>

                    <div class="dates">

                        <div>
                            <span>입대</span>
                            25.02.10
                        </div>

                        <div>
                            <span>전역</span>
                            26.10.09
                        </div>

                    </div>

                </div>


                <div class="neo-card trendy-progress-card">

                    <div class="progress-text-row">

                        <div
                            class="trendy-time-left"
                            id="trendy-time-left">
                            계산 중...
                        </div>

                        <div class="trendy-right-stats">

                            <span
                                class="trendy-served-days"
                                id="trendy-served-days">
                                0 / 606
                            </span>

                            <span
                                class="trendy-percentage"
                                id="trendy-percent">
                                0.000000%
                            </span>

                        </div>

                    </div>

                    <div class="trendy-bar-bg">

                        <div
                            class="trendy-bar-fill"
                            id="trendy-bar-fill">
                        </div>

                    </div>

                </div>

            </div>

        </div>

    </div>


    <!-- ==================== 이미지 저장 ==================== -->

    <div class="action-container">

        <button
            class="download-btn"
            onclick="generateHighQualityImage()">

            <img
                src="https://cdn.jsdelivr.net/gh/microsoft/fluentui-emoji@latest/assets/Camera%20with%20flash/3D/camera_with_flash_3d.png"
                alt="📸"
            >

            위젯 이미지 저장하기

        </button>

    </div>


    <div
        id="image-overlay"
        onclick="closeOverlay(event)">

        <div class="guide-text">
            이미지를 꾹 눌러 [사진 앱에 저장]하세요.
        </div>

        <img
            id="preview-image"
            src=""
            alt="프리뷰"
        >

        <button
            class="close-btn"
            onclick="document.getElementById('image-overlay').style.display='none';">

            닫기

        </button>

    </div>


    <script>

        /* =========================================================
           기본 날짜 설정
           ========================================================= */

        const startDate =
            new Date('2025-02-10T00:00:00+09:00');

        const endDate =
            new Date('2026-10-09T07:00:00+09:00');


        /*
         * 전체 복무일수
         *
         * 중요:
         * 사용자가 지정한 값이므로 606일을 고정합니다.
         */
        const totalDays = 606;

        const DAY_MS =
            1000 * 60 * 60 * 24;


        /* =========================================================
           날짜만 추출
           
           시각을 제거하여
           
           2026-10-06 20:00
           →
           2026-10-09 07:00
           
           를
           
           2026-10-06
           →
           2026-10-09
           
           로 계산합니다.
           ========================================================= */

        function getCalendarDate(date) {

            return new Date(
                date.getFullYear(),
                date.getMonth(),
                date.getDate()
            );

        }


        /* =========================================================
           군 복무 데이터 계산
           ========================================================= */

        function calculateMilitaryData() {

            const now = new Date();


            /* =====================================================
               1. 전체 진행률
               ===================================================== */

            const total =
                endDate.getTime() -
                startDate.getTime();

            const current =
                now.getTime() -
                startDate.getTime();


            let percent =
                (current / total) * 100;


            if (percent < 0) {
                percent = 0;
            }

            if (percent > 100) {
                percent = 100;
            }


            const percentStr =
                percent.toFixed(6) + '%';


            /* =====================================================
               2. 복무일수

               총 복무일수는 606일 고정.

               입대일을 1일차로 포함합니다.
               ===================================================== */

            let servedDays;


            if (now < startDate) {

                servedDays = 0;

            } else if (now >= endDate) {

                servedDays = totalDays;

            } else {

                servedDays =
                    Math.floor(
                        (
                            now.getTime() -
                            startDate.getTime()
                        ) / DAY_MS
                    ) + 1;


                if (servedDays > totalDays) {
                    servedDays = totalDays;
                }

            }


            const servedText =
                `${servedDays} / ${totalDays}`;


            /* =====================================================
               3. 진행률 UI
               ===================================================== */

            document.getElementById(
                'classic-percent'
            ).innerText = percentStr;


            document.getElementById(
                'classic-bar-fill'
            ).style.width = percentStr;


            document.getElementById(
                'classic-served-days'
            ).innerText = servedText;


            document.getElementById(
                'trendy-percent'
            ).innerText = percentStr;


            document.getElementById(
                'trendy-bar-fill'
            ).style.width = percentStr;


            document.getElementById(
                'trendy-served-days'
            ).innerText = servedText;


            /* =====================================================
               4. D-Day

               ★ 핵심 수정 부분 ★

               기존:
               endDate - now

               이 방식은 시각까지 계산하기 때문에

               10/06 20:00
               → 10/09 07:00

               = 2일 11시간

               따라서 D-2가 나왔습니다.

               이제는 날짜만 비교합니다.

               10/06
               → 10/09

               = 3일

               따라서 D-3이 됩니다.
               ===================================================== */

            const today =
                getCalendarDate(now);

            const dischargeDay =
                getCalendarDate(endDate);


            const calendarDiff =
                Math.floor(
                    (
                        dischargeDay.getTime() -
                        today.getTime()
                    ) / DAY_MS
                );


            let ddayStr;


            if (calendarDiff > 0) {

                ddayStr =
                    `D-${calendarDiff}`;

            } else if (calendarDiff === 0) {

                ddayStr =
                    'D-DAY';

            } else {

                ddayStr =
                    '전역 완료';

            }


            /* =====================================================
               D-Day 표시
               ===================================================== */

            document.getElementById(
                'classic-dday'
            ).innerText = ddayStr;


            document.getElementById(
                'trendy-dday'
            ).innerText = ddayStr;


            /* =====================================================
               5. 개월 / 일 남음

               D-Day와 동일하게 날짜 기준으로 계산합니다.

               예:

               10월 6일 → 10월 9일

               calendarDiff = 3

               30일 기준으로 환산:

               3 / 30
               = 0개월

               나머지
               = 3일

               결과:

               0개월 3일 남음
               ===================================================== */

            let timeLeftText;


            if (calendarDiff > 0) {

                const months =
                    Math.floor(
                        calendarDiff / 30
                    );

                const days =
                    calendarDiff % 30;


                timeLeftText =
                    `${months}개월 ${days}일 남음`;

            } else {

                timeLeftText =
                    '고생하셨습니다!';

            }


            /* =====================================================
               남은 기간 표시
               ===================================================== */

            document.getElementById(
                'classic-time-left'
            ).innerText = timeLeftText;


            document.getElementById(
                'trendy-time-left'
            ).innerText = timeLeftText;

        }


        /* =========================================================
           최초 실행
           ========================================================= */

        calculateMilitaryData();


        /*
         * 1분마다 갱신
         *
         * 날짜가 넘어가면 자동으로
         * D-3 → D-2 → D-1 → D-DAY
         * 로 변경됩니다.
         */

        setInterval(
            calculateMilitaryData,
            60000
        );


        /* =========================================================
           스타일 전환
           ========================================================= */

        let currentStyle = 'classic';


        function switchStyle(styleName, btn) {

            currentStyle =
                styleName;


            document.getElementById(
                'widget-classic'
            ).style.display =
                styleName === 'classic'
                    ? 'flex'
                    : 'none';


            document.getElementById(
                'widget-trendy'
            ).style.display =
                styleName === 'trendy'
                    ? 'block'
                    : 'none';


            document.querySelectorAll(
                '.tab-btn'
            ).forEach(
                b => b.classList.remove('active')
            );


            btn.classList.add('active');

        }


        /* =========================================================
           고화질 이미지 생성
           ========================================================= */

        function generateHighQualityImage() {

            const container =
                document.getElementById(
                    currentStyle === 'classic'
                        ? 'widget-classic'
                        : 'widget-trendy'
                );


            const options = {
                scale: 4,
                useCORS: true
            };


            if (currentStyle === 'trendy') {

                container.classList.add(
                    'is-capturing'
                );

                options.backgroundColor =
                    null;

            }


            html2canvas(
                container,
                options
            ).then(
                canvas => {

                    if (
                        currentStyle === 'trendy'
                    ) {

                        container.classList.remove(
                            'is-capturing'
                        );

                    }


                    document.getElementById(
                        'preview-image'
                    ).src =
                        canvas.toDataURL(
                            'image/png'
                        );


                    document.getElementById(
                        'image-overlay'
                    ).style.display =
                        'flex';

                }
            );

        }


        /* =========================================================
           이미지 오버레이 닫기
           ========================================================= */

        function closeOverlay(e) {

            if (
                e.target.id ===
                'image-overlay'
            ) {

                document.getElementById(
                    'image-overlay'
                ).style.display =
                    'none';

            }

        }

    </script>

</body>
</html>
